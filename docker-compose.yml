services:
  postgres:
    image: postgres:16-alpine
    container_name: cobi_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cobibread_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: cobi_adminer
    restart: always
    ports:
      - "8080:8080"

  n8n:
    image: n8nio/n8n:latest
    container_name: cobi_n8n
    restart: always
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  pg_data:
  n8n_data: